<style>/* ---------- Farbschemata ---------- */
:root {
  --fs: 22px; --lh: 1.5; --zoom: 1; --pad-x: calc(var(--fs) * 1.1);
  --doc-font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --ui-font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
body[data-theme="hell"] {
  --bg: #f8f9fb; --ink: #1b2430; --chrome: #e4e8ee; --chrome-2: #d7dde6; --tab: #d7dde6; --tab-hover: #ccd3de;
  --line: #c9d0db; --muted: #6f7a8a; --gutter: #b3bbc7; --accent: #2459c7; --on-accent: #fff;
  --sel: rgba(36, 89, 199, .2); --active-line: rgba(27, 36, 48, .035);
  --sheet: #fffef8; --sheet-ink: #6b6250; --tape: rgba(214, 196, 140, .55);
  --pop: #ffffff; --pop-ink: #1b2430; --shadow: 0 10px 30px rgba(20, 30, 50, .16), 0 2px 6px rgba(20, 30, 50, .08);
  --c-rot: #cf222e; --c-orange: #c4580a; --c-gelb: #a98500; --c-grün: #1a7f37; --c-blau: #0b5fd6; --c-lila: #7a3fd0; --c-pink: #bf2c78; --c-grau: #6e7781;
  --hl-gelb: rgba(255, 213, 0, .5); --hl-grün: rgba(60, 200, 105, .33); --hl-blau: rgba(70, 155, 255, .3); --hl-pink: rgba(255, 95, 170, .3); --hl-orange: rgba(255, 145, 40, .38); --hl-lila: rgba(160, 110, 255, .3);
  --match: rgba(255, 190, 0, .35); --match-cur: rgba(255, 140, 0, .6);
}
body[data-theme="sepia"] {
  --bg: #f6efdf; --ink: #3a3125; --chrome: #e9dfc9; --chrome-2: #ddd1b6; --tab: #ddd1b6; --tab-hover: #d3c5a7;
  --line: #cdbf9f; --muted: #7f7258; --gutter: #bcae8e; --accent: #8a4b12; --on-accent: #fff;
  --sel: rgba(138, 75, 18, .18); --active-line: rgba(58, 49, 37, .04);
  --sheet: #fffaf0; --sheet-ink: #7a6a4c; --tape: rgba(196, 170, 110, .5);
  --pop: #fffaf0; --pop-ink: #3a3125; --shadow: 0 10px 30px rgba(60, 40, 10, .18), 0 2px 6px rgba(60, 40, 10, .08);
  --c-rot: #b3261e; --c-orange: #b55a0d; --c-gelb: #957100; --c-grün: #2e6f32; --c-blau: #1f5aa6; --c-lila: #6f3fae; --c-pink: #a8306c; --c-grau: #7a7064;
  --hl-gelb: rgba(255, 205, 0, .45); --hl-grün: rgba(90, 190, 90, .32); --hl-blau: rgba(80, 150, 230, .28); --hl-pink: rgba(240, 100, 160, .28); --hl-orange: rgba(250, 140, 40, .35); --hl-lila: rgba(150, 110, 230, .28);
  --match: rgba(255, 180, 0, .35); --match-cur: rgba(230, 120, 0, .55);
}
body[data-theme="dunkel"] {
  color-scheme: dark;
  --bg: #262b33; --ink: #e2e6ec; --chrome: #1c2027; --chrome-2: #2f3540; --tab: #2a2f38; --tab-hover: #333a45;
  --line: #3b4250; --muted: #8e97a6; --gutter: #566070; --accent: #7aa7ff; --on-accent: #0f1726;
  --sel: rgba(122, 167, 255, .25); --active-line: rgba(255, 255, 255, .035);
  --sheet: #39404c; --sheet-ink: #c2c9d4; --tape: rgba(230, 220, 180, .22);
  --pop: #323844; --pop-ink: #e9ecf1; --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --c-rot: #ff7b72; --c-orange: #ffa657; --c-gelb: #f2cc60; --c-grün: #6bdc7c; --c-blau: #79b8ff; --c-lila: #d2a8ff; --c-pink: #f78fc6; --c-grau: #9aa3b0;
  --hl-gelb: rgba(242, 204, 96, .32); --hl-grün: rgba(86, 211, 100, .28); --hl-blau: rgba(88, 166, 255, .3); --hl-pink: rgba(247, 120, 186, .3); --hl-orange: rgba(255, 150, 70, .32); --hl-lila: rgba(190, 140, 255, .3);
  --match: rgba(255, 200, 60, .28); --match-cur: rgba(255, 160, 40, .5);
}
body[data-theme="tafel"] {
  color-scheme: dark;
  --bg: #2c4237; --ink: #f2f0e6; --chrome: #1f3028; --chrome-2: #33493e; --tab: #2a3d33; --tab-hover: #35493f;
  --line: #45604f; --muted: #a7b7ad; --gutter: #6c8577; --accent: #f4d35e; --on-accent: #1f3028;
  --sel: rgba(244, 211, 94, .22); --active-line: rgba(255, 255, 255, .035);
  --sheet: #e9e4d2; --sheet-ink: #4c4a3e; --tape: rgba(255, 255, 255, .35);
  --pop: #23362c; --pop-ink: #f2f0e6; --shadow: 0 10px 30px rgba(0, 0, 0, .4), 0 2px 6px rgba(0, 0, 0, .25);
  --c-rot: #ff8f86; --c-orange: #ffb36b; --c-gelb: #f6dc6d; --c-grün: #a6e89a; --c-blau: #9cc9ff; --c-lila: #dcb8ff; --c-pink: #ffa3d1; --c-grau: #b5c1b9;
  --hl-gelb: rgba(246, 220, 109, .3); --hl-grün: rgba(166, 232, 154, .25); --hl-blau: rgba(156, 201, 255, .26); --hl-pink: rgba(255, 163, 209, .26); --hl-orange: rgba(255, 179, 107, .3); --hl-lila: rgba(220, 184, 255, .26);
  --match: rgba(246, 220, 109, .3); --match-cur: rgba(255, 179, 107, .55);
}
body[data-theme="kontrast"] {
  --bg: #ffffff; --ink: #000000; --chrome: #ececec; --chrome-2: #dadada; --tab: #dadada; --tab-hover: #cfcfcf;
  --line: #9a9a9a; --muted: #4a4a4a; --gutter: #8a8a8a; --accent: #0038b8; --on-accent: #fff;
  --sel: rgba(0, 56, 184, .22); --active-line: rgba(0, 0, 0, .04);
  --sheet: #ffffff; --sheet-ink: #333; --tape: rgba(0, 0, 0, .15);
  --pop: #ffffff; --pop-ink: #000; --shadow: 0 0 0 2px #000, 0 10px 30px rgba(0, 0, 0, .2);
  --c-rot: #b00000; --c-orange: #a84300; --c-gelb: #806000; --c-grün: #006b1f; --c-blau: #0040c0; --c-lila: #5b1fb0; --c-pink: #a0005a; --c-grau: #555;
  --hl-gelb: rgba(255, 220, 0, .7); --hl-grün: rgba(70, 220, 110, .45); --hl-blau: rgba(90, 170, 255, .45); --hl-pink: rgba(255, 110, 190, .45); --hl-orange: rgba(255, 150, 40, .5); --hl-lila: rgba(170, 120, 255, .45);
  --match: rgba(255, 200, 0, .5); --match-cur: rgba(255, 120, 0, .7);
}

/* ---------- Grundgerüst ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-rows: auto auto 1fr auto;
  background: var(--bg); color: var(--ink);
  font: 13px/1.4 var(--ui-font); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#topbar { grid-row: 1; } #search { grid-row: 2; } #panes { grid-row: 3; } #status { grid-row: 4; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ic { display: block; flex: none; }

/* ---------- Kopfzeile mit Tabs (Sublime-artig) ---------- */
#topbar {
  display: flex; align-items: flex-end; gap: 4px;
  background: var(--chrome); padding: 6px 6px 0; min-height: 40px;
  border-bottom: 1px solid var(--line);
  user-select: none; position: relative; z-index: 5;
}
.tb {
  width: 30px; height: 28px; margin-bottom: 5px; border: 0; border-radius: 6px;
  background: transparent; color: var(--muted);
  display: grid; place-items: center;
}
.tb:hover { background: var(--chrome-2); color: var(--ink); }
.tb.on { background: var(--accent); color: var(--on-accent); }
.tb-group { display: flex; align-items: flex-end; gap: 1px; margin-left: 4px; }
#winctl { display: flex; align-self: stretch; margin: -6px -6px 0 4px; }
#winctl button { width: 46px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; padding: 0; }
#winctl button:hover { background: var(--chrome-2); }
#wc-close { display: none !important; }
body.fullscreen #wc-close { display: grid !important; }
#wc-close:hover { background: #c42b1c !important; color: #fff !important; }
.tb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px 10px; }

#tabs {
  flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 2px;
  overflow-x: auto; scrollbar-width: none; padding-left: 2px;
}
#tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: flex; align-items: center; gap: 6px;
  height: 33px; min-width: 96px; max-width: 220px; padding: 0 6px 0 14px;
  background: var(--tab); color: var(--muted);
  border-radius: 8px 8px 0 0; cursor: default; flex: none;
}
.tab:hover { background: var(--tab-hover); color: var(--ink); }
.tab.active { background: var(--bg); color: var(--ink); box-shadow: 0 1px 0 var(--bg); margin-bottom: -1px; height: 34px; }
.tab.other::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; border-radius: 2px; background: var(--accent); opacity: .5; }
.tab.drop { box-shadow: inset 2px 0 0 var(--accent); }
.tab-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-rename { flex: 1; min-width: 0; width: 100%; border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); color: var(--ink); padding: 2px 5px; outline: none; font-size: 13px; }
.tab.renaming { min-width: 180px; }
.tab-close {
  width: 20px; height: 20px; border: 0; border-radius: 4px; background: none; padding: 0;
  display: grid; place-items: center; color: inherit; opacity: .7;
}
.tab-close:hover { background: var(--chrome-2); opacity: 1; }
.tab-close .x { font-size: 16px; line-height: 1; }
.tab-close .dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tab.dirty .tab-close .x { display: none; }
.tab.dirty .tab-close .dot { display: block; }
.tab.dirty .tab-close:hover .dot { display: none; }
.tab.dirty .tab-close:hover .x { display: block; }
.tab-new { flex: none; width: 28px; height: 28px; margin: 0 0 3px 2px; border: 0; border-radius: 6px; background: none; color: var(--muted); display: grid; place-items: center; }
.tab-new:hover { background: var(--chrome-2); color: var(--ink); }

/* ---------- Suchleiste ---------- */
#search { display: none; background: var(--chrome); border-bottom: 1px solid var(--line); padding: 7px 10px; gap: 10px; align-items: center; flex-wrap: wrap; }
body.search-open #search { display: flex; }
.s-fields { display: flex; gap: 8px; flex: 1 1 420px; }
.s-field { flex: 1; display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding-left: 9px; }
.s-field:focus-within { border-color: var(--accent); }
.s-field span { color: var(--muted); font-size: 12px; margin-right: 6px; }
.s-field input { flex: 1; min-width: 0; border: 0; background: none; padding: 6px 8px 6px 0; outline: none; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
.s-field input.bad { color: var(--c-rot); }
.s-tools { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.s-tools button, .s-tools select { height: 28px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 0 9px; display: inline-grid; place-items: center; }
.s-tools button:hover { border-color: var(--muted); }
.s-tools .toggle { min-width: 32px; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
.s-tools .toggle.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.s-tools .primary, .dlg-btns .primary, .tm-custom .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.s-tools select { max-width: 210px; }
.s-gap { width: 6px; }
#s-count { color: var(--muted); font-size: 12px; min-width: 70px; padding: 0 4px; }
.s-tools .s-close { border: 0; background: none; font-size: 18px; color: var(--muted); }

/* ---------- Teilbare Ansicht ---------- */
#panes { --ratio: .5; display: flex; min-height: 0; position: relative; }
body.split-v #panes { flex-direction: column; }
.pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.pane[data-p="1"], #divider { display: none; }
body.split .pane[data-p="1"], body.split #divider { display: flex; }
body.split .pane[data-p="0"] { flex: 0 0 calc(var(--ratio) * 100% - 3px); }
#divider { flex: 0 0 6px; background: var(--chrome); cursor: col-resize; border-inline: 1px solid var(--line); }
body.split-v #divider { cursor: row-resize; border-inline: 0; border-block: 1px solid var(--line); }
#divider:hover { background: var(--chrome-2); }
.pane-head { display: none; align-items: center; padding: 4px 8px; background: var(--bg); border-bottom: 1px dashed var(--line); }
body.split .pane-head { display: flex; }
.pane-head select { border: 0; background: none; color: var(--muted); padding: 2px 4px; border-radius: 5px; max-width: 100%; font-size: 12px; }
.pane-head select:hover { background: var(--chrome); color: var(--ink); }
body.split .pane.active .pane-head { box-shadow: inset 0 -2px 0 var(--accent); }
body.split .pane.active .pane-head select { color: var(--ink); }
.pane-editor { flex: 1; min-height: 0; position: relative; }

/* ---------- Editor ---------- */
.cm-editor { height: 100%; background: var(--bg); color: var(--ink); }
.cm-editor.cm-focused { outline: none; }
.cm-scroller { font-family: var(--doc-font) !important; line-height: var(--lh) !important; overflow: auto; }
.cm-content { font-size: var(--fs); padding: .6em 0 40vh !important; caret-color: var(--accent); }
.cm-editor .cm-content .cm-line { padding: 0 var(--pad-x); line-height: var(--lh); }
.cm-cursor, .cm-dropCursor { border-left: max(2px, calc(var(--fs) * .09)) solid var(--accent) !important; }
.cm-selectionBackground, .cm-focused .cm-selectionBackground { background: var(--sel) !important; }
.cm-content ::selection { background: transparent; }
.cm-editor .cm-activeLine { background: var(--active-line); }
.cm-gutters { background: var(--bg) !important; border: 0 !important; color: var(--gutter); font-family: var(--ui-font); user-select: none; }
.cm-lineNumbers .cm-gutterElement {
  font-size: calc(var(--fs) * .58); line-height: calc(var(--fs) * var(--lh));
  padding: 0 4px 0 14px !important; min-width: 3.2em; font-variant-numeric: tabular-nums;
}
.cm-activeLineGutter { background: transparent !important; color: var(--muted); }
body.no-ln .cm-lineNumbers { display: none !important; }
.cm-hideGutter .cm-gutterElement { width: calc(var(--fs) * .9); display: flex; align-items: flex-start; justify-content: center; line-height: calc(var(--fs) * var(--lh)); }
.cm-eye { display: inline-flex; align-items: center; height: calc(var(--fs) * var(--lh)); font-size: calc(var(--fs) * .62); color: var(--gutter); opacity: 0; cursor: pointer; transition: opacity .12s; }
.cm-gutterElement:hover .cm-eye { opacity: 1; color: var(--accent); }
.cm-activeLineGutter .cm-eye { opacity: .45; }

/* Markup */
.cm-b { font-weight: 700; }
.cm-i { font-style: italic; }
.cm-syn { opacity: .38; font-weight: 400 !important; font-style: normal !important; color: var(--muted) !important; background: none !important; }
.cm-h1 { font-size: 1.62em; font-weight: 700; letter-spacing: -.01em; }
.cm-h2 { font-size: 1.3em; font-weight: 650; }
.cm-h3 { font-size: 1.1em; font-weight: 650; color: var(--muted); }
.cm-u { text-decoration: underline; text-decoration-thickness: max(1.5px, .065em); text-underline-offset: .18em; text-decoration-skip-ink: auto; }
.cm-uu { text-decoration: underline double; text-decoration-thickness: max(1px, .05em); text-underline-offset: .14em; text-decoration-skip-ink: none; }
.cm-u .cm-uu, .cm-uu .cm-u { text-decoration-line: underline; }
.cm-indent { display: inline-block; }
.cm-editor .cm-content .cm-rule { position: relative; }
.cm-rule::before { content: ""; position: absolute; left: var(--pad-x); right: var(--pad-x); top: 50%; border-top: max(2px, calc(var(--fs) * .08)) solid var(--line); border-radius: 2px; pointer-events: none; }
.cm-rule-edit { color: var(--muted); }
.cm-rule-edit::before { opacity: .6; }
.cm-arrow { font-family: "Segoe UI Symbol", "Cambria Math", var(--doc-font); white-space: nowrap; }
.cm-listmark { display: inline-block; text-indent: 0; color: var(--accent); }
.cm-listmark-bullet { font-weight: 700; }
.cm-listmark-num, .cm-listmark-alpha { font-variant-numeric: tabular-nums; font-weight: 600; }
.cm-link { color: var(--c-blau); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .15em; cursor: pointer; }
.c-rot { color: var(--c-rot); } .c-orange { color: var(--c-orange); } .c-gelb { color: var(--c-gelb); } .c-grün { color: var(--c-grün); }
.c-blau { color: var(--c-blau); } .c-lila { color: var(--c-lila); } .c-pink { color: var(--c-pink); } .c-grau { color: var(--c-grau); }
[class^="hl-"], [class*=" hl-"] { border-radius: .18em; padding: .02em .08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-gelb { background: var(--hl-gelb); } .hl-grün { background: var(--hl-grün); } .hl-blau { background: var(--hl-blau); }
.hl-pink { background: var(--hl-pink); } .hl-orange { background: var(--hl-orange); } .hl-lila { background: var(--hl-lila); }
.cm-match { background: var(--match); border-radius: 2px; }
.cm-match-current { background: var(--match-cur); }

/* Bilder */
.cm-imgline { padding-top: .25em !important; padding-bottom: .25em !important; }
.cm-img { display: inline-block; position: relative; vertical-align: top; width: calc(var(--w) * var(--zoom) * 1px); max-width: 100%; line-height: 0; text-indent: 0; }
.cm-img img { width: 100%; height: auto; border-radius: 4px; display: block; }
.cm-img-missing { line-height: 1.4; width: auto; font-size: .6em; color: var(--muted); border: 1px dashed var(--line); padding: .6em 1em; border-radius: 6px; }
.cm-img-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--pop); box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; line-height: 1; }
.cm-img:hover .cm-img-tools { opacity: 1; }
.cm-img-tools button { width: 28px; height: 26px; border: 0; border-radius: 6px; background: none; font-size: 16px; color: var(--pop-ink); }
.cm-img-tools button:hover { background: var(--chrome); }
.cm-img-handle { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); cursor: nwse-resize; opacity: 0; transition: opacity .12s; touch-action: none; }
.cm-img:hover .cm-img-handle { opacity: 1; }

/* Ausgeblendete Zeilen: Papierstreifen wie auf dem Hellraumprojektor */
.cm-hidden { padding: calc(var(--fs) * .18) var(--pad-x); cursor: pointer; font-size: var(--fs); }
.cm-hidden-sheet {
  position: relative; display: flex; align-items: center; gap: .8em;
  height: calc(var(--fs) * 1.25); padding: 0 1.2em;
  background: var(--sheet); color: var(--sheet-ink);
  font: 500 calc(var(--fs) * .52) / 1 var(--ui-font);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 3px 10px rgba(0, 0, 0, .06);
  transform: rotate(-.25deg); transition: transform .15s ease, box-shadow .15s ease;
  max-width: 34em;
  background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(0, 0, 0, .025) 22px 23px);
}
.cm-hidden-sheet::before, .cm-hidden-sheet::after {
  content: ""; position: absolute; top: -4px; width: 2.4em; height: calc(100% + 8px);
  background: var(--tape); mix-blend-mode: multiply;
}
body[data-theme="dunkel"] .cm-hidden-sheet::before, body[data-theme="dunkel"] .cm-hidden-sheet::after,
body[data-theme="tafel"] .cm-hidden-sheet::before, body[data-theme="tafel"] .cm-hidden-sheet::after { mix-blend-mode: normal; }
.cm-hidden-sheet::before { left: -.6em; transform: rotate(-4deg); }
.cm-hidden-sheet::after { right: -.6em; transform: rotate(5deg); }
.cm-hidden:hover .cm-hidden-sheet { transform: rotate(0) translateY(-1px); box-shadow: 0 2px 4px rgba(0, 0, 0, .14), 0 8px 18px rgba(0, 0, 0, .1); }
.cm-hidden-label { font-weight: 650; }
.cm-hidden-count { opacity: .65; }

/* Spotlight und Vorhang */
.cm-line { transition: opacity .18s ease; }
.cm-dim { opacity: .22; }
.cm-curtain, .cm-curtain * { color: transparent !important; text-decoration-color: transparent !important; background: none !important; }
.cm-curtain { background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--active-line) 10px 20px) !important; }
.cm-curtain .cm-img img, .cm-curtain .cm-img-tools, .cm-curtain .cm-img-handle { visibility: hidden; }

/* ---------- Auswahl-Popup ---------- */
#popup {
  position: fixed; left: 0; top: 0; z-index: 30; display: none;
  background: var(--pop); color: var(--pop-ink); border-radius: 10px; padding: 5px;
  box-shadow: var(--shadow); user-select: none;
}
#popup.show { display: block; animation: pop-in .12s ease-out; }
@keyframes pop-in { from { opacity: 0; } to { opacity: 1; } }
.pp-row { display: flex; align-items: center; gap: 2px; }
.pp-row2 { margin-top: 3px; padding-top: 4px; border-top: 1px solid var(--line); }
#popup button { height: 30px; min-width: 30px; border: 0; border-radius: 6px; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 6px; font-size: 14px; color: var(--pop-ink); }
#popup button:hover { background: var(--chrome); }
.pp-sep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--line); }
#popup .sw-text { font-weight: 800; font-size: 16px; min-width: 26px; padding: 0; }
#popup .sw-mark { min-width: 26px; padding: 0; }
.sw-mark span { display: block; width: 16px; height: 16px; border-radius: 4px; transform: skewX(-12deg); }
.pp-u { text-decoration: underline; text-underline-offset: 3px; }
.pp-uu { text-decoration: underline double; text-underline-offset: 3px; }
#popup .pp-hide { font-size: 13px; padding: 0 9px; color: var(--accent); font-weight: 600; }

/* ---------- Statusleiste ---------- */
#status { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 6px 0 12px; background: var(--chrome); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; user-select: none; }
.st-gap { flex: 1; }
.st-btn { border: 0; background: none; color: inherit; padding: 2px 8px; border-radius: 5px; font-size: 12px; }
.st-btn:hover { background: var(--chrome-2); color: var(--ink); }

/* ---------- Popover, Menü ---------- */
.pop { position: fixed; z-index: 40; display: none; background: var(--pop); color: var(--pop-ink); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.pop.open { display: block; }
#menu { min-width: 300px; }
#menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 24px; border: 0; background: none; padding: 7px 12px; border-radius: 6px; text-align: left; font-size: 13px; }
#menu button:hover { background: var(--accent); color: var(--on-accent); }
#menu kbd { font: 12px var(--ui-font); opacity: .6; }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
#lh-pop { display: none; gap: 2px; }
#lh-pop.open { display: flex; }
#lh-pop button, .tm-presets button, #tm-running button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
#lh-pop button:hover, .tm-presets button:hover, #tm-running button:hover { background: var(--chrome); }
#timer-pop { width: 252px; padding: 8px; }
.tm-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.tm-custom { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.tm-custom input { width: 64px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.tm-custom button { margin-left: auto; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; }
#tm-running { display: flex; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
#tm-running[hidden] { display: none; }
#tm-running button { flex: 1; border: 1px solid var(--line); }

/* Timer-Anzeige */
#timer-chip {
  --pct: 1; position: fixed; right: 18px; bottom: 40px; z-index: 25; display: none;
  align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border: 0; border-radius: 999px;
  background: var(--pop); color: var(--pop-ink); box-shadow: var(--shadow);
  font: 600 calc(var(--fs) * 1.0) / 1 var(--ui-font); font-variant-numeric: tabular-nums;
}
#timer-chip.show { display: flex; }
.tc-ring { width: 1.2em; height: 1.2em; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--pct) * 360deg), var(--line) 0); }
#timer-chip.paused { opacity: .7; }
#timer-chip.done { background: var(--c-rot); color: #fff; animation: flash 1s steps(2, start) infinite; }
#timer-chip.done .tc-ring { display: none; }
@keyframes flash { 50% { opacity: .55; } }

/* Laserpointer */
#laser { position: fixed; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; pointer-events: none; z-index: 60; display: none; background: radial-gradient(circle, #fff 0 18%, #ff2a2a 30% 55%, rgba(255, 42, 42, 0) 72%); box-shadow: 0 0 14px 6px rgba(255, 30, 30, .45); }
body.laser #laser { display: block; }
body.laser, body.laser * { cursor: none !important; }

/* Präsentation */
#peek { display: none; }
body.present #peek { display: block; position: fixed; inset: 0 0 auto 0; height: 8px; z-index: 50; }
body.present #topbar { position: fixed; inset: 0 0 auto 0; transform: translateY(-100%); transition: transform .18s ease; z-index: 51; box-shadow: var(--shadow); }
body.present.peeking #topbar { transform: none; }
body.present #status, body.present .pane-head { display: none !important; }
body.present #panes { grid-row: 1 / -1; }
body.present .cm-editor .cm-activeLine { background: transparent; }
body.present .cm-gutters { opacity: .6; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 48px; transform: translate(-50%, 10px); z-index: 70; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-width: 80vw; text-align: center; }
#toast.show { opacity: .94; transform: translate(-50%, 0); }

/* Dialoge */
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--pop); color: var(--pop-ink); box-shadow: var(--shadow); max-width: min(520px, 94vw); }
dialog::backdrop { background: rgba(10, 15, 25, .35); }
dialog form { padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 12px; }
dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
dialog fieldset { border: 0; padding: 0; margin: 0; }
dialog legend { padding: 0; margin-bottom: 8px; color: var(--muted); }
.themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.theme-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.theme-opt input { position: absolute; opacity: 0; pointer-events: none; }
.theme-sw { width: 100%; height: 44px; border-radius: 8px; display: grid; place-items: center; font-size: 17px; font-weight: 600; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.theme-opt input:checked + .theme-sw { border-color: var(--accent); }
.theme-opt input:focus-visible + .theme-sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-opt[data-t="hell"] .theme-sw { background: #f8f9fb; color: #1b2430; }
.theme-opt[data-t="sepia"] .theme-sw { background: #f6efdf; color: #3a3125; }
.theme-opt[data-t="dunkel"] .theme-sw { background: #262b33; color: #e2e6ec; }
.theme-opt[data-t="tafel"] .theme-sw { background: #2c4237; color: #f2f0e6; font-family: "Segoe Print", cursive; }
.theme-opt[data-t="kontrast"] .theme-sw { background: #fff; color: #000; box-shadow: inset 0 0 0 2px #000; }
dialog .row { display: grid; grid-template-columns: 120px 1fr 56px; align-items: center; gap: 10px; }
dialog .row select { grid-column: 2 / 4; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
dialog .row input[type="range"] { accent-color: var(--accent); }
dialog .row output { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
dialog .check { display: flex; align-items: center; gap: 8px; }
dialog .check input { accent-color: var(--accent); width: 16px; height: 16px; }
dialog .hint { margin: 0; color: var(--muted); font-size: 12px; }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.dlg-btns button { border: 1px solid var(--line); background: var(--bg); padding: 7px 14px; border-radius: 7px; }
#ask-msg { margin: 0 0 4px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Installierte Web-App mit eigener Titelleiste (Windows-Knöpfe von Windows selbst) */
@media (display-mode: window-controls-overlay) {
  #topbar {
    -webkit-app-region: drag; app-region: drag;
    min-height: max(40px, env(titlebar-area-height, 40px));
    padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 6px);
  }
  #topbar button, #topbar .tab, #topbar input, #topbar select { -webkit-app-region: no-drag; app-region: no-drag; }
  body:not(.fullscreen) #winctl { display: none; }
}
</style>
</head>

    <button id="btn-timer" class="tb" data-icon="timer" data-pop-anchor title="Timer (F9)" aria-label="Timer"></button>

    <button id="btn-curtain" class="tb" data-icon="curtain" title="Vorhang (F7)" aria-label="Vorhang"></button>
    <button id="btn-laser" class="tb" data-icon="laser" title="Laserpointer (F8)" aria-label="Laserpointer"></button>

    <button id="btn-split" class="tb" data-icon="split" title="Ansicht teilen (Alt+T)" aria-label="Ansicht teilen"></button>

</header>

<footer id="status">

</footer>

Dieses Dokument ist gleichzeitig die Anleitung. Probiere alles direkt hier aus, mit Ctrl+Z machst du jede Änderung rückgängig.

## Text auszeichnen
- *Fett* mit Sternchen oder Ctrl+B
- _Kursiv_ mit Unterstrichen oder Ctrl+I
- {rot:Farbiger Text} in acht Farben und {!gelb:Textmarker} in sechs Farben
- Text markieren: Es erscheint ein kleines Menü mit Farben, Ausrichtung und Listen
- ~Unterstrichen~ mit Ctrl+U und ~~doppelt unterstrichen~~ mit Ctrl+Shift+D
- Steht der Cursor in einer Zeile, werden die Markup-Zeichen blass sichtbar
- Klammern und Anführungszeichen werden automatisch geschlossen
- Aus Minus- oder Gleichheitszeichen und Grösser-als werden echte Pfeile: -> --> <-> =>
- Drei Minuszeichen allein auf einer Zeile ergeben eine Trennlinie:
---

## Ausrichtung
>< Zentriert mit Ctrl+E
>> Rechtsbündig mit Ctrl+R
Linksbündig mit Ctrl+L

## Listen
- Aufzählung: Zeile mit einem Minus und einem Leerzeichen beginnen
    - Tab rückt um eine Ebene (4 Leerzeichen) ein, Shift+Tab rückt aus
        - Enter setzt die Liste fort, Enter auf einem leeren Punkt beendet sie
1. Nummerierung: Zeile mit «1.» und einem Leerzeichen beginnen
2. Die Nummern passen sich beim Einfügen und Löschen automatisch an
    a) Unterpunkte gehen auch mit Buchstaben
    b) Die Rücktaste direkt nach dem Aufzählungszeichen entfernt es

## Lösungen verstecken
Fahre links über den Rand neben den Zeilennummern: Ein Klick auf das Auge blendet die Zeile samt eingerückten Unterzeilen aus. Ein Klick auf den Papierstreifen deckt sie wieder auf.
1. Berechne die Hypotenuse c für a = 3 und b = 4.
    Lösung: c = √(3² + 4²) = √25 = {grün:*5*}
2. Wie lang ist c für a = 5 und b = 12?
    Lösung: c = √(25 + 144) = √169 = {grün:*13*}
Ausgeblendete Zeilen werden beim Speichern mitgespeichert, so kannst du Lösungen zu Hause vorbereiten.

## Bilder
Ein Bild ins Fenster ziehen, mit Ctrl+V einfügen oder im Menü «Bild einfügen» wählen. Die Grösse änderst du mit dem Griff unten rechts oder mit + und −.
>< ![img_demo|340]

## Ansicht
- Zwei Finger auf dem Touchpad auseinanderziehen (oder Ctrl+Mausrad) vergrössert die Schrift, Ctrl+0 setzt sie zurück
- Alt+T teilt die Ansicht: In jeder Hälfte lässt sich oben ein Dokument wählen, auch zweimal dasselbe
- Links wie https://www.zh.ch öffnen sich per Klick im Browser, Alt+Klick setzt den Cursor hinein
- Farbschema und Zeilenabstand wechselst du unten rechts

## Für den Unterricht
- Die App wechselt beim ersten Klick ins Vollbild. Oben rechts verlässt du es oder schliesst die App, F11 schaltet um
- F5: Präsentation blendet Tabs und Leisten aus, Esc oder F5 beendet sie
- F6: Spotlight hebt die aktuelle Zeile hervor
- F7: Vorhang verdeckt alles unterhalb der aktuellen Zeile, mit der Pfeiltaste nach unten deckst du Zeile für Zeile auf
- F8: Laserpointer
- F9: Timer für Übungsphasen
- Ctrl+H: Suchen und Ersetzen, mit Vorlagen zum Bereinigen von Text aus PDFs

## Dateien
Ctrl+O öffnet, Ctrl+S speichert als gewöhnliche Textdatei. Ungespeicherte Texte bleiben auch nach dem Schliessen des Fensters erhalten.
Mit Ctrl+Shift+E (oder im Menü) exportierst du das Dokument als Word-Datei, mit allen Farben und Hervorhebungen, zum Beispiel für die Lernenden. Ausgeblendete Lösungen kannst du dabei weglassen.
